name: CI Pipeline - Navalha Urbana MVP
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
    - run: pip install -r requirements.txt
    - run: flake8 app tests --count --select=E9,F63,F7,F82 --show-source
    - run: pytest
